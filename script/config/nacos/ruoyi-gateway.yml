# 安全配置
security:
    # 不校验白名单
    ignore:
      whites:
        - /auth/code
        - /auth/logout
        - /auth/login
        - /auth/binding
        - /auth/register
        - /auth/tenant/list
        - /*/v3/api-docs
        - /*/error
        - /csrf

spring:
  cloud:
    # 网关配置
    gateway:
      # 打印请求日志(自定义)
      requestLog: true
      server:
        webflux:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: true
          routes:
            # 认证中心
            - id: ruoyi-auth
              uri: lb://ruoyi-auth
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            # 权限中心
            - id: ruoyi-permission-center
              uri: lb://ruoyi-permission-center
              predicates:
                - Path=/permission-center/**
              filters:
                - StripPrefix=1
