# 权限中心：可指向独立库或与 system 共用库（共用时与 datasource.system-master 一致）
spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${datasource.system-master.url:jdbc:mysql://127.0.0.1:3306/ry-cloud?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
          username: ${datasource.system-master.username:root}
          password: ${datasource.system-master.password:password}

mybatis-plus:
  mapperPackage: org.dromara.permission.mapper

# 本服务不启用数据权限；接入方如需数据权限请在各自配置中开启
ruoyi:
  mybatis:
    data-permission:
      enabled: false
