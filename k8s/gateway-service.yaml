# RuoYi Gateway Service - 端口与 Dockerfile EXPOSE 8080 一致
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-gateway
  namespace: ruoyi
  labels:
    app.kubernetes.io/name: gateway
spec:
  type: ClusterIP  # 若需对外暴露可改为 LoadBalancer 或配合 Ingress
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
