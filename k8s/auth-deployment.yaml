# RuoYi Auth - 与 workflow 中 auth / ruoyi-auth 对应
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-auth
  namespace: ruoyi
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: auth
    spec:
      containers:
        - name: auth
          image: docker.io/<DOCKER_HUB_USERNAME>/ruoyi-auth:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9210
          env:
            - name: SERVER_PORT
              value: "9210"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9210
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9210
            initialDelaySeconds: 30
            periodSeconds: 5
