# RuoYi Gateway - 与 workflow 中 gateway / ruoyi-gateway 对应
# 镜像需替换: <DOCKER_HUB_USERNAME> 来自 secrets.DOCKER_HUB_USERNAME
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-gateway
  namespace: ruoyi
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 1  # 生产可按需调整
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: gateway
    spec:
      # imagePullSecrets:  # 若镜像为私有仓库，取消注释并创建 Secret
      #   - name: docker-hub-secret
      containers:
        - name: gateway  # 与 kubectl set image deployment/ruoyi-gateway gateway=IMAGE 中的容器名一致
          image: docker.io/<DOCKER_HUB_USERNAME>/ruoyi-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            # 以下为未知/需按环境补充的配置（如 Nacos、Redis 等）
            # - name: SPRING_PROFILES_ACTIVE
            #   value: "prod"
            # - name: NACOS_SERVER_ADDR
            #   value: "nacos.ruoyi.svc:8848"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
