# RuoYi Permission Center - 与 workflow 中 permission-center / ruoyi-permission-center 对应
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-permission-center
  namespace: ruoyi
  labels:
    app.kubernetes.io/name: permission-center
    app.kubernetes.io/component: permission-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: permission-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: permission-center
        app.kubernetes.io/component: permission-center
    spec:
      containers:
        - name: permission-center
          image: docker.io/<DOCKER_HUB_USERNAME>/ruoyi-permission-center:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9320
          env:
            - name: SERVER_PORT
              value: "9320"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9320
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9320
            initialDelaySeconds: 30
            periodSeconds: 5
