name: Build All Images

on:
  workflow_dispatch:
    inputs:
      push:
        description: '是否推送镜像到 Docker Hub'
        required: true
        type: boolean
        default: true

env:
  SERVICES: |
    gateway ruoyi-gateway
    auth ruoyi-auth
    permission-center ruoyi-modules/ruoyi-permission-center

jobs:
  build-all:
    name: Build All Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set Build Tag
        id: tag
        run: |
          echo "tag=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build All Modules
        run: |
          mvn -pl ruoyi-gateway,ruoyi-auth,ruoyi-modules/ruoyi-permission-center -am clean install -DskipTests -Dmaven.javadoc.skip=true -Dcheckstyle.skip=true

      - name: Login to Docker Hub
        if: inputs.push == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push All Images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DO_PUSH: ${{ inputs.push }}
        run: |
          echo "${{ env.SERVICES }}" | while read -r name module; do
            [ -z "$name" ] && continue
            image="docker.io/${DOCKER_USER}/ruoyi-${name}"
            echo "=== Building $image:${TAG} (module: $module) ==="
            (cd "$module" && docker build -t "$image:$TAG" .)
            if [ "$DO_PUSH" = "true" ]; then
              echo "Pushing $image:$TAG"
              docker push "$image:$TAG"
            fi
          done

      - name: Summary
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          USER="${{ secrets.DOCKER_HUB_USERNAME }}"
          echo "## 全部镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **构建标签**: ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- **推送镜像**: ${{ inputs.push && '是' || '否' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 镜像列表" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for name in gateway auth permission-center; do
            echo "docker.io/${USER}/ruoyi-${name}:${TAG}" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
