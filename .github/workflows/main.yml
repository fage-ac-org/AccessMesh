name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: '选择要部署的服务'
        required: true
        type: choice
        options:
          - gateway
          - auth
          - system
          - resource
          - gen
          - job
          - workflow
          - monitor
          - nacos
          - permission-center
          - snailjob-server
      environment:
        description: '部署环境'
        required: false
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod
      deploy:
        description: '是否执行部署'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ github.event.inputs.service }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set Build Time
        id: time
        run: |
          echo "tag=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Determine Module Path
        id: paths
        run: |
          SERVICE=${{ github.event.inputs.service }}
          case $SERVICE in
            gateway) echo "module=ruoyi-gateway" >> $GITHUB_OUTPUT ;;
            auth) echo "module=ruoyi-auth" >> $GITHUB_OUTPUT ;;
            system) echo "module=ruoyi-modules/ruoyi-system" >> $GITHUB_OUTPUT ;;
            resource) echo "module=ruoyi-modules/ruoyi-resource" >> $GITHUB_OUTPUT ;;
            gen) echo "module=ruoyi-modules/ruoyi-gen" >> $GITHUB_OUTPUT ;;
            job) echo "module=ruoyi-modules/ruoyi-job" >> $GITHUB_OUTPUT ;;
            workflow) echo "module=ruoyi-modules/ruoyi-workflow" >> $GITHUB_OUTPUT ;;
            monitor) echo "module=ruoyi-visual/ruoyi-monitor" >> $GITHUB_OUTPUT ;;
            nacos) echo "module=ruoyi-visual/ruoyi-nacos" >> $GITHUB_OUTPUT ;;
            permission-center) echo "module=ruoyi-modules/ruoyi-permission-center" >> $GITHUB_OUTPUT ;;
            snailjob-server) echo "module=ruoyi-visual/ruoyi-snailjob-server" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build All Modules
        run: |
          mvn clean install -DskipTests -Dmaven.javadoc.skip=true -Dcheckstyle.skip=true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push Image
        id: docker
        run: |
          SERVICE=${{ github.event.inputs.service }}
          MODULE=${{ steps.paths.outputs.module }}
          TAG=${{ steps.time.outputs.tag }}
          IMAGE=docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/ruoyi-$SERVICE

          echo "Building $IMAGE:$TAG"
          cd $MODULE
          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG

          if [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            docker tag $IMAGE:$TAG $IMAGE:latest
            docker push $IMAGE:latest
          fi

          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.service }}-image
          path: |
            ${{ steps.paths.outputs.module }}/target/*.jar
          retention-days: 1

  deploy-k8s:
    name: Deploy to K8s
    needs: build
    if: github.event.inputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Set Build Time
        id: time
        run: |
          echo "tag=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Deploy Service
        run: |
          SERVICE=${{ github.event.inputs.service }}
          TAG=${{ steps.time.outputs.tag }}
          IMAGE=docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/ruoyi-$SERVICE

          case $SERVICE in
            gateway) DEPLOY=ruoyi-gateway ;;
            auth) DEPLOY=ruoyi-auth ;;
            system) DEPLOY=ruoyi-system ;;
            resource) DEPLOY=ruoyi-resource ;;
            gen) DEPLOY=ruoyi-gen ;;
            job) DEPLOY=ruoyi-job ;;
            workflow) DEPLOY=ruoyi-workflow ;;
            monitor) DEPLOY=ruoyi-monitor ;;
            nacos) DEPLOY=ruoyi-nacos ;;
            permission-center) DEPLOY=ruoyi-permission-center ;;
            snailjob-server) DEPLOY=ruoyi-snailjob-server ;;
          esac

          echo "Deploying $DEPLOY with image $IMAGE:$TAG"
          kubectl set image deployment/$DEPLOY $SERVICE=$IMAGE:$TAG -n web

      - name: Wait for Rollout
        run: |
          SERVICE=${{ github.event.inputs.service }}
          case $SERVICE in
            gateway) DEPLOY=ruoyi-gateway ;;
            auth) DEPLOY=ruoyi-auth ;;
            system) DEPLOY=ruoyi-system ;;
            resource) DEPLOY=ruoyi-resource ;;
            gen) DEPLOY=ruoyi-gen ;;
            job) DEPLOY=ruoyi-job ;;
            workflow) DEPLOY=ruoyi-workflow ;;
            monitor) DEPLOY=ruoyi-monitor ;;
            nacos) DEPLOY=ruoyi-nacos ;;
            permission-center) DEPLOY=ruoyi-permission-center ;;
            snailjob-server) DEPLOY=ruoyi-snailjob-server ;;
          esac
          kubectl rollout status deployment/$DEPLOY -n web --timeout=300s

      - name: Verify Status
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ruoyi -l app.kubernetes.io/name=${{ github.event.inputs.service }}

  summary:
    name: Summary
    needs: [build, deploy-k8s]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          SERVICE=${{ github.event.inputs.service }}
          TAG=$(date +%Y%m%d%H%M%S)
          IMAGE=docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/ruoyi-$SERVICE

          echo "## 部署摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **服务**: $SERVICE" >> $GITHUB_STEP_SUMMARY
          echo "- **环境**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **镜像**: $IMAGE:$TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **构建**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **部署**: ${{ needs.deploy-k8s.result }}" >> $GITHUB_STEP_SUMMARY
